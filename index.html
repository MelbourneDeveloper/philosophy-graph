<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lineage Engine</title>
<meta name="description" content="An interactive graph of philosophers, their books, their words, and the schools they made.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,400;0,500;0,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f6f6f3; --surface:#ffffff; --surface-2:#efefea; --line:#dededa; --line-soft:#e9e9e4;
  --ink:#15171c; --ink-2:#4c5462; --ink-3:#7d8595;
  --person:#2a78d6; --work:#eda100; --quote:#e87ba4; --school:#008300;
  --accent:#2a78d6; --glow:0 0 0 rgba(0,0,0,0);
  --shadow:0 1px 2px rgba(20,24,34,.06),0 8px 24px rgba(20,24,34,.08);
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --panel-w:392px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101319; --surface:#171b22; --surface-2:#1e232c; --line:#2b3240; --line-soft:#232936;
    --ink:#e9ecf2; --ink-2:#a8b0be; --ink-3:#727b8b;
    --person:#3987e5; --work:#c98500; --quote:#d55181; --school:#3fa63f;
    --accent:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101319; --surface:#171b22; --surface-2:#1e232c; --line:#2b3240; --line-soft:#232936;
  --ink:#e9ecf2; --ink-2:#a8b0be; --ink-3:#727b8b;
  --person:#3987e5; --work:#c98500; --quote:#d55181; --school:#3fa63f;
  --accent:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr}
#stage{position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.grabbing{cursor:grabbing}
canvas.pointing{cursor:pointer}

/* ---------- top bar ---------- */
header{
  display:flex;align-items:center;gap:18px;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.brand h1{
  font-family:var(--font-display);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:0;
}
.brand .tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.spacer{flex:1 1 auto}

.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{
  width:100%;padding:7px 30px 7px 30px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);font-size:13px;
}
.search input::placeholder{color:var(--ink-3)}
.search .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;font-size:12px}
.search kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);
  font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 4px;pointer-events:none;
}
#results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:340px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);
  z-index:40;display:none;padding:4px;
}
#results.on{display:block}
#results .row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer}
#results .row:hover,#results .row.sel{background:var(--surface-2)}
#results .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#results .row .yr{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.sq{border-radius:2px}
.dot.di{border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
.dot.ri{border-radius:50%;background:transparent!important;border:2.5px solid currentColor}

/* filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px;color:var(--ink-2);
  transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="false"]{opacity:.5}
.chip .n{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}

.tools{display:flex;gap:6px}
.tbtn{
  padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:12px;color:var(--ink-2);white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- detail panel ---------- */
#panel{
  position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);max-width:100%;
  background:var(--surface);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.22,.7,.3,1);
  display:flex;flex-direction:column;z-index:20;box-shadow:var(--shadow);
}
#panel.open{transform:none}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);position:relative;flex:0 0 auto}
.p-kind{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.p-title{font-family:var(--font-display);font-size:26px;line-height:1.18;font-weight:500;margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
.p-title.q{font-size:20px;font-style:italic;font-weight:400}
.p-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.p-close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-3);line-height:1;font-size:15px;display:grid;place-items:center}
.p-close:hover{color:var(--ink);border-color:var(--ink-3)}
.p-body{overflow-y:auto;padding:16px 20px 40px;flex:1 1 auto;display:flex;flex-direction:column;gap:20px}
.blurb{font-family:var(--font-display);font-size:15.5px;line-height:1.6;color:var(--ink-2);margin:0}
.sep-x{
  border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0;
}
.sep-x p{
  font-family:var(--font-display);font-size:14px;line-height:1.6;color:var(--ink-2);margin:0;
}
.sep-x .sep-note{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.sep-cred{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:6px;
}
.sect h3{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:500;display:flex;gap:7px;align-items:center;
}
.sect h3::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.list{display:flex;flex-direction:column;gap:1px}
.item{
  display:flex;align-items:flex-start;gap:9px;padding:6px 8px;margin:0 -8px;border-radius:6px;
  cursor:pointer;text-align:left;border:0;background:none;width:calc(100% + 16px);
}
.item:hover{background:var(--surface-2)}
.item .dot{margin-top:5px}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t1{display:block;font-size:13.5px;line-height:1.35}
.item .t2{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.item.qi .t1{font-family:var(--font-display);font-style:italic;font-size:14px}
.pill{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:1px 6px;margin-top:3px;flex:0 0 auto}

/* ---------- legend / hud ---------- */
#hud{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:10;pointer-events:none}
.card{
  background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;box-shadow:var(--shadow);backdrop-filter:blur(8px);pointer-events:auto;
}
.legend{display:flex;flex-direction:column;gap:5px}
.legend .lr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.legend .lr .k{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-left:auto}
.hint{font-size:11px;color:var(--ink-3);max-width:250px;line-height:1.45}
.hint b{color:var(--ink-2);font-weight:500}

#status{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:12;
  font-size:12.5px;display:none;align-items:center;gap:10px;
}
#status.on{display:flex}
#status .x{cursor:pointer;color:var(--ink-3);border:0;background:none;font-size:14px;line-height:1;padding:0 2px}
#status .x:hover{color:var(--ink)}

#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:0;z-index:10;transition:transform .28s cubic-bezier(.22,.7,.3,1)}
#zoomctl.shift{transform:translateX(calc(-1 * var(--panel-w)))}
#zoomctl button{
  width:30px;height:30px;background:var(--surface);border:1px solid var(--line);cursor:pointer;
  color:var(--ink-2);display:grid;place-items:center;font-size:14px;
}
#zoomctl button:first-child{border-radius:8px 8px 0 0}
#zoomctl button:last-child{border-radius:0 0 8px 8px}
#zoomctl button+button{border-top:0}
#zoomctl button:hover{background:var(--surface-2);color:var(--ink)}

#tooltip{
  position:absolute;z-index:15;pointer-events:none;max-width:270px;padding:7px 10px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  font-size:12.5px;display:none;line-height:1.4;
}
#tooltip.on{display:block}
#tooltip .tk{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
#tooltip .tq{font-family:var(--font-display);font-style:italic}
#tooltip b{font-weight:600}
#tooltip .tb{display:block;margin-top:3px;color:var(--ink-2);font-size:11.5px;line-height:1.45}

@media (max-width:820px){
  :root{--panel-w:100%}
  header{gap:10px;padding:8px 10px}
  .brand h1{font-size:16px}
  .brand .tag{display:none}
  #hud{display:none}
  .search{flex:1 1 100%;order:5}
}
@media (prefers-reduced-motion:reduce){
  #panel{transition:none} #zoomctl{transition:none}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <h1>The Lineage Engine</h1>
    <span class="tag">who shaped whom</span>
  </div>
  <div class="search" role="search">
    <span class="icon">&#9906;</span>
    <input id="q" type="text" placeholder="Search thinkers, books, quotes, schools&hellip;" autocomplete="off" spellcheck="false" aria-label="Search the graph">
    <kbd>/</kbd>
    <div id="results" role="listbox"></div>
  </div>
  <div class="spacer"></div>
  <div class="chips" id="chips" role="group" aria-label="Show node kinds">
    <button class="chip" data-kind="p" aria-pressed="true"><span class="dot" style="background:var(--person)"></span>Thinkers <span class="n" id="np"></span></button>
    <button class="chip" data-kind="w" aria-pressed="true"><span class="dot sq" style="background:var(--work)"></span>Works <span class="n" id="nw"></span></button>
    <button class="chip" data-kind="q" aria-pressed="true"><span class="dot di" style="background:var(--quote)"></span>Quotes <span class="n" id="nq"></span></button>
    <button class="chip" data-kind="m" aria-pressed="true"><span class="dot ri" style="color:var(--school)"></span>Schools <span class="n" id="nm"></span></button>
  </div>
  <div class="tools">
    <button class="tbtn" id="traceBtn" title="Pick two nodes; I chart the chain of influence between them">Trace a lineage</button>
    <button class="tbtn" id="timeBtn" title="Lay every node on the axis of history">Timeline</button>
    <button class="tbtn" id="btnRand" title="Jump somewhere unexpected">Surprise me</button>
    <button class="tbtn" id="btnReset" title="Reset filters, pins and view">Reset</button>
  </div>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="status" class="card"><span id="statusTxt"></span><button class="x" id="statusX" aria-label="Clear">&#10005;</button></div>
  <div id="hud">
    <div class="card legend" id="legend">
      <div class="lr"><span class="dot" style="background:var(--person)"></span>Thinker <span class="k">circle</span></div>
      <div class="lr"><span class="dot sq" style="background:var(--work)"></span>Work <span class="k">square</span></div>
      <div class="lr"><span class="dot di" style="background:var(--quote)"></span>Quote <span class="k">diamond</span></div>
      <div class="lr"><span class="dot ri" style="color:var(--school)"></span>School <span class="k">ring</span></div>
    </div>
    <div class="card hint">
      <b>Hover</b> to light a life &middot; <b>click</b> for the dossier &middot; <b>double&#8209;click</b> to isolate a circle &middot; <b>drag</b> a node to pin it &middot; <b>scroll</b> to zoom &middot; <b>/</b> to search
    </div>
  </div>
  <div id="zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zfit" aria-label="Fit graph" title="Fit">&#8857;</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
  </div>
  <div id="tooltip"></div>
  <aside id="panel" aria-label="Details">
    <div class="p-head">
      <button class="p-close" id="pclose" aria-label="Close panel">&#10005;</button>
      <div class="p-kind" id="pkind"></div>
      <h2 class="p-title" id="ptitle"></h2>
      <div class="p-meta" id="pmeta"></div>
    </div>
    <div class="p-body" id="pbody"></div>
  </aside>
</div>
</div>
<script src="site/graph.js"></script>
<script src="site/app.js"></script>
</body>
</html>
